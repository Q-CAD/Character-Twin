[project]
name = "character-twin"
version = "0.1.0"
description = "Simulator for standard characterization protocols (RHEED, CBED, SAED, EELS, XRD) from CIF structures and instrument parameters"
authors = [
    {name = "Sumner Harris"},
    {name = "Panchapakesan Ganesh"},
    {name = "Rama Vasudevan"},
    {name = "Debangshu Mukherjee"},
    {name = "Simon Kim"},
    {name = "Soumendu Bagchi"},
]
readme = "README.md"
license = {text = "BSD-3-Clause"}
requires-python = ">=3.10,<3.13"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "numpy",
    "pymatgen",
]

[project.optional-dependencies]
dev = [
    "ruff >= 0.11",
    "pytest >= 8.3.2",
    "pytest-cov",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/character_twin"]

[tool.uv]
package = true

[tool.pytest.ini_options]
filterwarnings = ["error"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W"]
